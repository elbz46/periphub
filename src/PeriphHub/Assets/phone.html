<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161b">
<title>PeriphHub Deck</title>
<style>
  :root { --bg:#14161b; --fg:#eef0f5; --muted:#8a91a1; --cell:#2b2f3a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  header { display:flex; align-items:center; gap:8px; padding:2px 2px 10px; }
  header button { background:#262a33; color:var(--fg); border:0; border-radius:10px; width:44px; height:38px; font-size:18px; }
  header .name { flex:1; text-align:center; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .pos { color:var(--muted); font-weight:400; font-size:13px; margin-left:6px; }
  #grid { flex:1; display:grid; gap:var(--gap, 8px); min-height:0; overflow:hidden;
    justify-content:center; align-content:center; --s:80px; }
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding-bottom:6px; }
    header button { height:32px; width:40px; }
    header .name { font-size:14px; }
  }
  .cell { position:relative; border-radius:calc(var(--s) * .18); background:var(--cell); display:flex; flex-direction:column;
    align-items:center; justify-content:center; overflow:hidden; user-select:none; -webkit-user-select:none;
    touch-action:none; transition:transform .06s ease, filter .06s ease; min-height:0; }
  .cell.empty { background:#1c1f26; }
  .cell.down { transform:scale(.93); filter:brightness(1.25); }
  .cell img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.6; pointer-events:none; }
  .cell .icon { position:relative; font-size:calc(var(--s) * .36); line-height:1.1; text-align:center; padding:0 4px; }
  .cell .icon.small { font-size:calc(var(--s) * .24); font-variant-numeric:tabular-nums; font-weight:600; }
  .cell .label { position:relative; font-size:clamp(9px, calc(var(--s) * .14), 16px); margin-top:4px; padding:0 6px; max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e8eaf0; }
  #status { color:var(--muted); font-size:12px; text-align:center; padding-top:8px; min-height:20px; }
</style>
</head>
<body>
<header>
  <button id="prev" aria-label="Previous page">‹</button>
  <div class="name"><span id="page">Deck</span><span class="pos" id="pos"></span></div>
  <button id="next" aria-label="Next page">›</button>
</header>
<div id="grid"></div>
<div id="status">Connecting…</div>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const grid = document.getElementById("grid");
const status = document.getElementById("status");
let layoutKey = "", cells = {}, artVersion = {};

function api(path, method) {
  return fetch(path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token), { method: method || "GET", cache: "no-store" });
}
function press(i, down) { api(`/api/press?i=${i}&d=${down ? 1 : 0}`, "POST").catch(() => {}); }
document.getElementById("prev").onclick = () => api("/api/nav?dir=prev", "POST").then(refresh);
document.getElementById("next").onclick = () => api("/api/nav?dir=next", "POST").then(refresh);

/* Works in portrait and landscape, on phones and tablets: find the number of columns that gives the
   biggest square buttons with every button visible, then size the grid exactly. */
function layout(n) {
  const W = grid.clientWidth, H = grid.clientHeight;
  const gap = Math.max(5, Math.min(10, Math.round(Math.min(W, H) / 60)));
  let best = { cols: 1, size: 0 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const size = Math.floor(Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r));
    if (size > best.size) best = { cols: c, size };
  }
  const size = Math.max(36, Math.min(best.size, 220));
  grid.style.setProperty("--gap", gap + "px");
  grid.style.setProperty("--s", size + "px");
  grid.style.gridTemplateColumns = `repeat(${best.cols}, ${size}px)`;
  grid.style.gridAutoRows = size + "px";
  grid.style.gridTemplateRows = "";
}

function build(s) {
  grid.innerHTML = ""; cells = {};
  // Keep the deck's order; drop trailing empty slots so the buttons can be as large as possible.
  let last = s.buttons.length - 1;
  while (last > 0 && s.buttons[last].empty) last--;
  layout(last + 1);
  for (const b of s.buttons.slice(0, last + 1)) {
    const el = document.createElement("div");
    el.className = "cell";
    el.innerHTML = '<img hidden alt=""><div class="icon"></div><div class="label"></div>';
    let isDown = false;
    const down = e => { e.preventDefault(); if (el.classList.contains("empty")) return; isDown = true; el.classList.add("down"); if (navigator.vibrate) navigator.vibrate(12); press(b.i, true); };
    const up = e => { e.preventDefault(); if (!isDown) return; isDown = false; el.classList.remove("down"); press(b.i, false); setTimeout(refresh, 150); };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("contextmenu", e => e.preventDefault());
    grid.appendChild(el);
    cells[b.i] = el;
  }
}

function render(s) {
  document.getElementById("page").textContent = (s.folder ? "📁 " : "") + s.page;
  document.getElementById("pos").textContent = !s.folder && s.pages > 1 ? `${s.pos}/${s.pages}` : "";
  const key = `${s.rows}x${s.cols}|${s.page}|${window.innerWidth}x${window.innerHeight}|${s.buttons.map(b => b.empty ? 0 : 1).join("")}`;
  if (key !== layoutKey) { layoutKey = key; build(s); }
  for (const b of s.buttons) {
    const el = cells[b.i]; if (!el) continue;
    el.classList.toggle("empty", !!b.empty);
    const icon = el.querySelector(".icon"), label = el.querySelector(".label"), img = el.querySelector("img");
    if (b.empty) { icon.textContent = ""; label.textContent = ""; img.hidden = true; el.style.background = ""; continue; }
    icon.textContent = b.icon || "";
    icon.classList.toggle("small", /^[0-9—:%A-Za-z!. ]+$/.test(b.icon || "") && (b.icon || "").length >= 3);
    label.textContent = b.label || "";
    el.style.background = b.color || "";
    if (b.img) {
      const v = b.tile === "nowplaying" ? s.art : "static";
      if (artVersion[b.i] !== v + layoutKey) { artVersion[b.i] = v + layoutKey; img.src = `/api/img?i=${b.i}&t=${encodeURIComponent(token)}&v=${encodeURIComponent(v)}`; }
      img.hidden = false;
    } else img.hidden = true;
  }
}

let failures = 0;
function refresh() {
  return api("/api/state").then(r => {
    if (r.status === 403) { status.textContent = "This link is no longer valid. Scan the QR code in PeriphHub again."; throw 0; }
    return r.json();
  }).then(s => { failures = 0; status.textContent = ""; render(s); })
    .catch(() => { if (++failures > 2) status.textContent = "Can't reach PeriphHub. Is the PC on and on the same Wi-Fi?"; });
}
refresh();
setInterval(refresh, 1000);
let resizeTimer;
function relayout() { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layoutKey = ""; refresh(); }, 120); }
window.addEventListener("resize", relayout);
window.addEventListener("orientationchange", relayout);
if (screen.orientation) screen.orientation.addEventListener("change", relayout);
</script>
</body>
</html>
